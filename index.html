<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Wobble Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one full-screen canvas; score and lives float on top, a thumb-reach tray sits on the sea at the bottom. */
:root {
  color-scheme: light;
  --ink: #1b2a5a;
  --card: rgba(255, 255, 255, .92);
  --coral: #ff6b6b;
  --sun: #ffd166;
  --mint: #5fd6a8;
  --sea: #2f8fd8;
  --font: "Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: #8fd3ff; color: var(--ink); font-family: var(--font); font-weight: 500;
  overflow: hidden; overscroll-behavior: none; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#cv.grabbing { cursor: grabbing; }

.hud { position: absolute; top: 12px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
.pill { background: var(--card); border-radius: 18px; padding: 8px 14px; box-shadow: 0 4px 0 rgba(27, 42, 90, .18); }
.score { display: flex; flex-direction: column; line-height: 1.1; }
.lab { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; opacity: .65; }
.big { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
.sub { font-size: 14px; opacity: .75; font-variant-numeric: tabular-nums; }
.lives { display: flex; gap: 4px; font-size: 24px; line-height: 1; padding: 10px 12px; }
.lives span { color: var(--coral); transition: transform .25s, color .25s; }
.lives span.gone { color: #cfd6e6; transform: scale(.8); }

#hint {
  position: absolute; left: 16px; right: 16px; top: 30%; margin: 0; text-align: center;
  font-size: 20px; font-weight: 600; color: #fff; text-shadow: 0 2px 0 rgba(27, 42, 90, .45);
  pointer-events: none; transition: opacity .5s; text-wrap: balance;
}
#hint.hide { opacity: 0; }
#follow {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: 132px;
  padding: 10px 18px; border-radius: 999px; background: var(--card); font-size: 16px; font-weight: 600;
  box-shadow: 0 4px 0 rgba(27, 42, 90, .2); display: flex; align-items: center; gap: 8px; touch-action: manipulation;
}
#follow[hidden] { display: none; }
#follow:active { transform: translateX(-50%) translateY(2px); box-shadow: 0 2px 0 rgba(27, 42, 90, .2); }
#follow svg { width: 18px; height: 18px; }
@media (max-height: 520px) { #follow { bottom: 104px; } }

#bar {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 14px;
  display: flex; justify-content: center; align-items: flex-end; gap: 12px;
}
button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: none; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.rot {
  width: 60px; height: 60px; border-radius: 50%; background: var(--sun);
  box-shadow: 0 5px 0 #d9a130; display: grid; place-items: center;
}
.rot:active { transform: translateY(3px); box-shadow: 0 2px 0 #d9a130; }
.rot svg { width: 28px; height: 28px; }
.slot {
  width: 92px; padding: 6px 6px 4px; border-radius: 20px; background: var(--card);
  box-shadow: 0 5px 0 rgba(27, 42, 90, .22); display: flex; flex-direction: column; align-items: center; gap: 0;
}
.slot canvas { width: 76px; height: 76px; display: block; }
.slot span { font-size: 13px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
#next { cursor: grab; }
#hold { background: rgba(255, 255, 255, .78); outline: 3px dashed rgba(27, 42, 90, .3); outline-offset: -6px; }
#hold:active { transform: translateY(3px); }

#over {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 16px;
  background: rgba(27, 42, 90, .45);
}
#over[hidden] { display: none; }
.card {
  background: #fff; border-radius: 28px; padding: 24px 28px; text-align: center; max-width: 340px; width: 100%; max-height: 100%; overflow-y: auto;
  box-shadow: 0 8px 0 rgba(27, 42, 90, .3);
}
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.tools { display: flex; gap: 8px; pointer-events: auto; }
.tool { width: 44px; height: 44px; border-radius: 50%; background: var(--card); box-shadow: 0 4px 0 rgba(27, 42, 90, .18); display: grid; place-items: center; touch-action: manipulation; }
.tool:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(27, 42, 90, .18); }
.tool svg { width: 22px; height: 22px; }
#snd .off { display: none; }
#snd.muted .off { display: inline; }
#snd.muted .on { display: none; }
.card h2 { margin: 14px 0 6px; font-size: 14px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; opacity: .65; }
#board { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; text-align: left; }
#board li { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-radius: 12px; background: #f1f4fb; font-size: 16px; }
#board li.me { background: #fff1c9; font-weight: 600; }
#board .rk { width: 1.4em; font-weight: 700; opacity: .6; font-variant-numeric: tabular-nums; }
#board .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#board .sc { font-weight: 700; font-variant-numeric: tabular-nums; }
#board li.empty { justify-content: center; opacity: .7; text-wrap: balance; text-align: center; }
.card .note { font-size: 13px; opacity: .7; margin-top: 8px; text-wrap: balance; }
.card h1 { margin: 0 0 4px; font-size: 28px; font-weight: 700; text-wrap: balance; }
.card p { margin: 0; font-size: 16px; }
.card .final { font-size: 52px; font-weight: 700; color: var(--coral); margin: 6px 0; font-variant-numeric: tabular-nums; }
.card button {
  margin-top: 16px; padding: 12px 28px; border-radius: 999px; background: var(--mint);
  font-size: 20px; font-weight: 700; box-shadow: 0 5px 0 #2f9f76; touch-action: manipulation;
}
.card button:active { transform: translateY(3px); box-shadow: 0 2px 0 #2f9f76; }
#fail { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-size: 18px; }
#fail[hidden] { display: none; }
@media (max-height: 520px) { .big { font-size: 26px; } .slot canvas { width: 56px; height: 56px; } .slot { width: 72px; } .rot { width: 52px; height: 52px; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div class="hud">
    <div class="pill score">
      <span class="lab">Tower height</span>
      <span class="big" id="h">0.0 m</span>
      <span class="sub" id="pk">Peak 0.0 m</span>
    </div>
    <div class="side">
      <div class="pill lives" id="lives" role="img" aria-label="3 lives left"><span>&#9829;</span><span>&#9829;</span><span>&#9829;</span></div>
      <div class="tools">
        <button class="tool" id="lb" aria-label="Show leaderboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0z"></path><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 20h8"></path></svg>
        </button>
        <button class="tool" id="snd" aria-label="Sound" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"></path><path class="on" d="M16.5 8.5a5 5 0 0 1 0 7"></path><path class="off" d="M17 9l5 6M22 9l-5 6"></path></svg>
        </button>
      </div>
    </div>
  </div>
  <p id="hint">Drag the Next block up onto the island and let go to drop it</p>
  <button id="follow" hidden aria-label="Jump back to the top of the tower">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
    Back to top
  </button>
  <div id="bar">
    <button class="rot" id="ccw" aria-label="Rotate left">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
    </button>
    <button class="slot" id="next" aria-label="Next block. Drag it into the sky."><canvas id="nextCv"></canvas><span>Next</span></button>
    <button class="slot" id="hold" aria-label="Hold. Tap to store or swap the block."><canvas id="holdCv"></canvas><span>Hold</span></button>
    <button class="rot" id="cw" aria-label="Rotate right">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
    </button>
  </div>
  <div id="over" hidden>
    <div class="card">
      <h1 id="ovTitle">Splash! Tower's done</h1>
      <div id="result">
        <p>Your tower peaked at</p>
        <div class="final" id="final">0.0 m</div>
      </div>
      <h2 id="boardTitle">Leaderboard</h2>
      <ol id="board"></ol>
      <p class="note" id="boardNote"></p>
      <button id="again">Play again</button>
    </div>
  </div>
  <div id="fail" hidden>The physics engine could not load. Check your connection and reload the page.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(function () {
  'use strict';
  if (!window.Matter) { document.getElementById('fail').hidden = false; return; }
  const { Engine, Bodies, Body, Composite, Events, Query, Sleeping } = Matter;

  // ---------- constants ----------
  const U = 40;            // pixels per metre
  const W = 480;           // island sits at the middle of this strip
  const SEA = 170;         // world y of the sea surface (island top is y = 0)
  const STEP = 1000 / 60;
  const DEG = Math.PI / 180;
  const COLORS = [
    ['#ff6b6b', '#c94545'], ['#ffd166', '#d9a130'], ['#5fd6a8', '#2f9f76'], ['#4dabf7', '#2577bd'],
    ['#b197fc', '#7b5fd0'], ['#ff8fc7', '#d15a97'], ['#ff9f45', '#d06f17'], ['#38d9d9', '#1a9c9c']
  ];
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- dom ----------
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const nextCv = $('nextCv'), holdCv = $('holdCv');
  const bar = $('bar'), hint = $('hint');
  let dpr = 1, cssW = 0, cssH = 0, scale = 1, viewW = W, viewH = 800, offX = 0, camY = 0, camBase = 0;
  let manualCam = false;   // true once the player scrolls the view themselves
  let twist = null, pan = null, lookHintShown = false;

  // ---------- physics ----------
  const engine = Engine.create({ enableSleeping: true, positionIterations: 10, velocityIterations: 8 });
  const world = engine.world;
  const island = Bodies.rectangle(W / 2, 25, 250, 50, { isStatic: true, friction: 1 });
  Composite.add(world, island);
  const OPT = { friction: 0.9, frictionStatic: 1.2, restitution: 0.02, density: 0.002, sleepThreshold: 45 };
  const R = { chamfer: { radius: 6 } };
  const o = extra => Object.assign({}, OPT, extra || {});

  const SHAPES = [
    { w: 3, face: 44, make: () => Bodies.rectangle(0, 0, 60, 60, o(R)) },
    { w: 2, face: 56, make: () => Bodies.rectangle(0, 0, 80, 80, o(R)) },
    { w: 3, face: 26, make: () => Bodies.rectangle(0, 0, 140, 30, o(R)) },
    { w: 3, face: 40, make: () => Bodies.rectangle(0, 0, 100, 50, o(R)) },
    { w: 2, face: 34, make: () => Bodies.rectangle(0, 0, 40, 110, o(R)) },
    { w: 2, face: 34, make: () => Bodies.fromVertices(0, 0, [[{ x: -50, y: 32 }, { x: 50, y: 32 }, { x: 0, y: -38 }]], o()) },
    { w: 2, face: 40, make: () => Bodies.trapezoid(0, 0, 110, 54, 0.5, o(R)) },
    { w: 2, face: 46, make: () => Bodies.polygon(0, 0, 6, 40, o(R)) },
    { w: 1, face: 44, make: () => Bodies.circle(0, 0, 32, o()) },
    { w: 2, face: 36, make: () => {
        const v = [];
        for (let i = 0; i <= 12; i++) { const a = Math.PI + (i / 12) * Math.PI; v.push({ x: Math.cos(a) * 55, y: Math.sin(a) * 55 }); }
        return Bodies.fromVertices(0, 0, [v], o());
      } },
    { w: 2, face: 30, part: 1, make: () => Body.create(o({ parts: [
        Bodies.rectangle(0, 0, 40, 120, o(R)), Bodies.rectangle(40, 40, 40, 40, o(R))] })) },
    { w: 2, face: 30, part: 1, make: () => Body.create(o({ parts: [
        Bodies.rectangle(0, 0, 120, 40, o(R)), Bodies.rectangle(0, 40, 40, 40, o(R))] })) }
  ];
  const TOTAL_W = SHAPES.reduce((s, x) => s + x.w, 0);
  let lastColor = -1;

  function makeBlock() {
    let r = Math.random() * TOTAL_W, shape = SHAPES[0];
    for (const s of SHAPES) { r -= s.w; if (r < 0) { shape = s; break; } }
    let ci; do { ci = Math.floor(Math.random() * COLORS.length); } while (ci === lastColor);
    lastColor = ci;
    const body = shape.make();
    let span = 0;
    for (const v of body.vertices) span = Math.max(span, Math.hypot(v.x - body.position.x, v.y - body.position.y));
    body.plugin = { color: COLORS[ci][0], dark: COLORS[ci][1], face: shape.face, part: shape.part || 0,
      span: span * 2, blink: Math.random() * 5, calm: 0, wet: false };
    return { body, target: 0 };
  }

  // ---------- game state ----------
  let current, held, drag, lives, height, peak, best = 0, milestone, over, started;
  try { best = parseFloat(localStorage.getItem('wobble-tower-best')) || 0; } catch (e) {}
  const particles = [];
  let panel = '';   // '', 'over' or 'board'

  // ---------- sound (synthesised, no files) ----------
  let ac = null, muted = false, lastBop = 0, noiseBuf = null;
  try { muted = localStorage.getItem('wobble-tower-muted') === '1'; } catch (e) {}
  function audio() {
    if (muted) return null;
    try {
      if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ac = new C(); }
      if (ac.state === 'suspended') ac.resume();
      return ac.state === 'running' ? ac : null;
    } catch (e) { return null; }
  }
  function bop(strength) {
    const a = audio(); if (!a) return;
    const t = a.currentTime; if (t - lastBop < 0.05) return; lastBop = t;
    const osc = a.createOscillator(), g = a.createGain();
    const f = 150 + Math.random() * 110, vol = Math.min(0.32, 0.05 + strength * 0.03);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(f * 1.9, t); osc.frequency.exponentialRampToValueAtTime(f, t + 0.07);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    osc.connect(g); g.connect(a.destination); osc.start(t); osc.stop(t + 0.18);
  }
  function splashSound() {
    const a = audio(); if (!a) return;
    const t = a.currentTime;
    if (!noiseBuf) {
      noiseBuf = a.createBuffer(1, Math.floor(a.sampleRate * 0.6), a.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = a.createBufferSource(), bp = a.createBiquadFilter(), g = a.createGain();
    src.buffer = noiseBuf; bp.type = 'bandpass'; bp.Q.value = 0.8;
    bp.frequency.setValueAtTime(1600, t); bp.frequency.exponentialRampToValueAtTime(320, t + 0.5);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.28, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
    src.connect(bp); bp.connect(g); g.connect(a.destination); src.start(t); src.stop(t + 0.6);
    const osc = a.createOscillator(), g2 = a.createGain();
    osc.frequency.setValueAtTime(520, t); osc.frequency.exponentialRampToValueAtTime(130, t + 0.22);
    g2.gain.setValueAtTime(0.0001, t); g2.gain.exponentialRampToValueAtTime(0.22, t + 0.01); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
    osc.connect(g2); g2.connect(a.destination); osc.start(t); osc.stop(t + 0.28);
  }
  function showMute() { $('snd').classList.toggle('muted', muted); $('snd').setAttribute('aria-pressed', String(!muted)); }
  $('snd').addEventListener('click', () => {
    muted = !muted; showMute();
    try { localStorage.setItem('wobble-tower-muted', muted ? '1' : '0'); } catch (e) {}
    if (!muted) bop(3);
  });
  showMute();
  window.addEventListener('pointerdown', audio, true);   // browsers only start audio after a touch or click
  window.addEventListener('keydown', audio, true);

  // ---------- leaderboard ----------
  // Shared board: one document per player at scores/<their id>, holding their best height.
  // If the shared store is not available, the board shows this device's own top runs.
  let db = null, user = null, uid = null, shared = [], boardState = 'loading', myShared = null, writing = false, readOnly = false, snapSeq = 0;
  let localRuns = [];
  try { localRuns = (JSON.parse(localStorage.getItem('wobble-tower-runs')) || []).map(Number).filter(n => n > 0).slice(0, 5); } catch (e) {}
  const clean = v => { const n = Number(v); return n > 0 && n < 10000 ? Math.round(n * 10) / 10 : 0; };

  function renderBoard() {
    const ol = $('board'); ol.textContent = '';
    let rows, note = '';
    if (boardState === 'ok') {
      rows = shared; $('boardTitle').textContent = 'Leaderboard';
      if (readOnly) note = 'You can see this leaderboard, but your own scores stay on this device.';
    } else {
      rows = localRuns.map(v => ({ name: 'You', best: v, me: false }));
      $('boardTitle').textContent = 'Your top runs';
      note = boardState === 'loading' ? 'Loading the shared leaderboard…'
        : boardState === 'slow' ? 'The shared leaderboard can\'t be reached yet. Showing runs from this device.'
        : 'Scores are saved on this device.';
    }
    if (!rows.length) {
      const li = document.createElement('li'); li.className = 'empty';
      li.textContent = 'No scores yet. Yours could be first.'; ol.appendChild(li);
    }
    rows.forEach((r, i) => {
      const li = document.createElement('li'); if (r.me) li.className = 'me';
      const a = document.createElement('span'), b = document.createElement('span'), c = document.createElement('span');
      a.className = 'rk'; b.className = 'nm'; c.className = 'sc';
      a.textContent = i + 1; b.textContent = r.name + (r.me ? ' (you)' : ''); c.textContent = r.best.toFixed(1) + ' m';
      li.append(a, b, c); ol.appendChild(li);
    });
    $('boardNote').textContent = note; $('boardNote').hidden = !note;
  }

  async function initBoard() {
    try {
      if (!window.claude || !claude.use) throw 0;
      [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      if (!db) throw 0;
      uid = user ? await user.id() : null;
      const timer = setTimeout(() => { if (boardState === 'loading') { boardState = 'slow'; renderBoard(); } }, 10000);
      db.collection('scores').orderBy('best', 'desc').limit(10).onSnapshot(async snap => {
        const seq = ++snapSeq;
        const rows = snap.docs.map(d => ({ id: d.id, best: clean((d.data() || {}).best), me: d.id === uid })).filter(r => r.best > 0);
        let ps = {};
        try { if (user && rows.length) ps = (await user.profiles(rows.map(r => r.id))) || {}; } catch (e) {}
        if (seq !== snapSeq) return;
        rows.forEach(r => { r.name = (ps[r.id] && ps[r.id].name) || 'Mystery stacker'; });
        clearTimeout(timer); shared = rows; boardState = 'ok'; renderBoard();
      }, () => { clearTimeout(timer); boardState = 'local'; renderBoard(); });
    } catch (e) { boardState = 'local'; renderBoard(); }
  }

  async function submitScore(score) {
    localRuns.push(score); localRuns.sort((a, b) => b - a); localRuns = localRuns.slice(0, 5);
    try { localStorage.setItem('wobble-tower-runs', JSON.stringify(localRuns)); } catch (e) {}
    renderBoard();
    if (!db || !uid || writing || readOnly) return;
    writing = true;
    try {
      const ref = db.doc('scores/' + uid);
      if (myShared === null) { const s = await ref.get(); myShared = s.exists ? clean((s.data() || {}).best) : 0; }
      if (score > myShared) { await ref.set({ best: score, at: Date.now() }); myShared = score; }
    } catch (e) {
      if (e && e.code === 'invalid_argument') { readOnly = true; renderBoard(); }
    }
    writing = false;
  }

  function openPanel(mode) {
    panel = mode;
    $('ovTitle').textContent = mode === 'over' ? "Splash! Tower's done" : 'Tallest towers';
    $('result').hidden = mode !== 'over';
    $('again').textContent = mode === 'over' ? 'Play again' : 'Back to game';
    renderBoard();
    $('over').hidden = false;
  }
  $('lb').addEventListener('click', () => { if (!over && !panel) openPanel('board'); });

  function reset() {
    for (const b of Composite.allBodies(world)) if (!b.isStatic) Composite.remove(world, b);
    current = makeBlock(); held = null; drag = null;
    lives = 3; height = 0; peak = 0; milestone = 0; over = false;
    particles.length = 0;
    panel = ''; $('over').hidden = true;
    camY = camBase; manualCam = false; twist = null; pan = null;
    drawLives(); hudCache = '';
  }

  function drawLives() {
    const spans = $('lives').children;
    for (let i = 0; i < spans.length; i++) spans[i].classList.toggle('gone', i >= lives);
    $('lives').setAttribute('aria-label', lives + (lives === 1 ? ' life left' : ' lives left'));
  }

  function loseLife() {
    if (over) return;
    lives--; drawLives();
    if (lives <= 0) {
      over = true; drag = null; cv.classList.remove('grabbing');
      if (peak > best) { best = peak; try { localStorage.setItem('wobble-tower-best', best.toFixed(1)); } catch (e) {} }
      $('final').textContent = peak.toFixed(1) + ' m';
      const score = Math.round(peak * 10) / 10;
      if (score > 0) submitScore(score);
      setTimeout(() => { if (over) openPanel('over'); }, 700);
    }
  }

  // ---------- input ----------
  function toWorld(cx, cy) {
    const r = cv.getBoundingClientRect();
    return { x: (cx - r.left) / scale - offX, y: (cy - r.top) / scale + camY };
  }
  function startDrag(e) {
    if (over || panel || drag || !current) return;
    e.preventDefault();
    drag = { id: e.pointerId, touch: e.pointerType === 'touch', cx: e.clientX, cy: e.clientY, ok: false };
    cv.classList.add('grabbing');
  }
  function endDrag(e, cancel) {
    if (!drag || e.pointerId !== drag.id) return;
    twist = null;
    drag.cx = e.clientX; drag.cy = e.clientY;
    placeHeld();
    const inTray = drag.cy > bar.getBoundingClientRect().top;
    const ok = drag.ok && !inTray && !cancel;
    drag = null; cv.classList.remove('grabbing');
    if (ok) drop();
  }
  function placeHeld() {
    const b = current.body;
    const p = toWorld(drag.cx, drag.cy - (drag.touch ? 80 : 0));
    Body.setPosition(b, p);
    const others = Composite.allBodies(world);
    const parts = b.parts.length > 1 ? b.parts.slice(1) : [b];
    drag.ok = !parts.some(pt => Query.collides(pt, others).length > 0) && p.y < SEA - 20;
  }
  function drop() {
    const b = current.body;
    Body.setVelocity(b, { x: 0, y: 0 }); Body.setAngularVelocity(b, 0);
    for (const x of Composite.allBodies(world)) if (!x.isStatic) Sleeping.set(x, false);
    Composite.add(world, b);
    current = makeBlock();
    if (!started) { started = true; hint.classList.add('hide'); }
  }
  function rotate(dir) { if (current && !over && !panel) current.target += dir * 15 * DEG; }
  function swapHold() {
    if (over || panel || drag) return;
    const t = held; held = current; current = t || makeBlock();
  }

  // Twist: while one finger holds a block, a second finger anywhere spins it.
  const angleOf = () => Math.atan2(twist.cy - drag.cy, twist.cx - drag.cx);
  function startTwist(e) {
    if (!drag || twist || e.pointerId === drag.id || !current) return false;
    if (e.target.closest && e.target.closest('button')) return false;   // rotate buttons still work as buttons
    e.preventDefault();
    twist = { id: e.pointerId, cx: e.clientX, cy: e.clientY, last: 0, total: 0, t0: current.target };
    twist.last = angleOf();
    return true;
  }
  function moveTwist() {
    const a = angleOf();
    let d = a - twist.last;
    if (d > Math.PI) d -= 2 * Math.PI; else if (d < -Math.PI) d += 2 * Math.PI;
    twist.last = a; twist.total += d;
    current.target = twist.t0 + twist.total;
  }
  function endTwist(e) {
    if (!twist || e.pointerId !== twist.id) return;
    twist = null;
    if (!current) return;
    const step = 15 * DEG, snapped = Math.round(current.target / step) * step;   // settle onto a neat angle when close
    if (Math.abs(snapped - current.target) < 6 * DEG) current.target = snapped;
  }

  // Pan: drag the sky to scroll the view up and down the tower.
  function startPan(e) {
    if (drag || over || panel) return;
    e.preventDefault();
    pan = { id: e.pointerId, y0: e.clientY, cam0: camY, moved: false };
    cv.classList.add('grabbing');
  }
  function lookAround(dy) { camY += dy; manualCam = true; }

  window.addEventListener('pointerdown', e => { startTwist(e); });
  cv.addEventListener('pointerdown', e => { if (!drag) startPan(e); });
  $('next').addEventListener('pointerdown', e => { pan = null; startDrag(e); });
  window.addEventListener('pointermove', e => {
    if (drag && e.pointerId === drag.id) {
      drag.cx = e.clientX; drag.cy = e.clientY;
      if (drag.cy < bar.getBoundingClientRect().top - 90) drag.armed = true;
      if (twist) moveTwist();
    } else if (twist && e.pointerId === twist.id) {
      twist.cx = e.clientX; twist.cy = e.clientY; moveTwist();
    } else if (pan && e.pointerId === pan.id) {
      const dy = e.clientY - pan.y0;
      if (Math.abs(dy) > 6) pan.moved = true;
      if (pan.moved) { camY = pan.cam0 - dy / scale; manualCam = true; }
    }
  });
  function upAny(e, cancel) {
    endTwist(e);
    endDrag(e, cancel);
    if (pan && e.pointerId === pan.id) { pan = null; cv.classList.remove('grabbing'); }
  }
  window.addEventListener('pointerup', e => upAny(e, false));
  window.addEventListener('pointercancel', e => upAny(e, true));
  document.addEventListener('gesturestart', e => e.preventDefault());   // stop iOS pinch-zoom stealing the twist
  $('follow').addEventListener('click', () => { manualCam = false; });
  $('hold').addEventListener('click', swapHold);
  $('again').addEventListener('click', () => { if (panel === 'board') { panel = ''; $('over').hidden = true; } else reset(); });
  window.addEventListener('contextmenu', e => e.preventDefault());

  function holdRepeat(el, dir) {
    let timer = null, wait = null;
    const stop = () => { clearInterval(timer); clearTimeout(wait); timer = wait = null; };
    el.addEventListener('pointerdown', e => {
      e.preventDefault(); stop(); rotate(dir);
      wait = setTimeout(() => { timer = setInterval(() => rotate(dir), 90); }, 300);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(n => el.addEventListener(n, stop));
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); rotate(dir); } });
  }
  holdRepeat($('ccw'), -1); holdRepeat($('cw'), 1);

  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'arrowleft' || k === 'a' || k === 'q') rotate(-1);
    else if (k === 'arrowright' || k === 'd' || k === 'e') rotate(1);
    else if (k === 'h' || k === 'c' || k === 'shift') swapHold();
    else if (k === 'arrowup' || k === 'w') { e.preventDefault(); lookAround(-60); }
    else if (k === 'arrowdown' || k === 's') { e.preventDefault(); lookAround(60); }
    else if (k === 'home' || k === 'f') manualCam = false;
  });
  // Wheel spins the block while you hold one, and scrolls the view otherwise.
  window.addEventListener('wheel', e => {
    if (over || panel) return;
    if (drag) rotate(e.deltaY > 0 ? 1 : -1);
    else lookAround(e.deltaY / scale * 0.8);
  }, { passive: true });

  // ---------- effects ----------
  function puff(x, y, n, color) {
    if (reduceMotion || particles.length > 160) return;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 0.4 + Math.random() * 1.6;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.6, g: 0, life: 0, max: 380 + Math.random() * 200, r: 3 + Math.random() * 4, color });
    }
  }
  function splash(x) {
    if (reduceMotion) return;
    for (let i = 0; i < 14; i++) {
      particles.push({ x: x + (Math.random() - 0.5) * 40, y: SEA, vx: (Math.random() - 0.5) * 4, vy: -3 - Math.random() * 5, g: 0.25, life: 0, max: 700, r: 3 + Math.random() * 4, color: '#e8f8ff' });
    }
  }
  function confetti(y, text) {
    particles.push({ x: W / 2, y: y - 30, vx: 0, vy: -0.6, g: 0, life: 0, max: 1600, text });
    if (reduceMotion) return;
    for (let i = 0; i < 36; i++) {
      particles.push({ x: W / 2 + (Math.random() - 0.5) * 120, y, vx: (Math.random() - 0.5) * 7, vy: -3 - Math.random() * 6, g: 0.22, life: 0, max: 1500, r: 4 + Math.random() * 3, color: COLORS[i % COLORS.length][0], sq: true, spin: Math.random() * 6 });
    }
  }
  Events.on(engine, 'collisionStart', ev => {
    for (const p of ev.pairs) {
      const a = p.bodyA.parent || p.bodyA, b = p.bodyB.parent || p.bodyB;
      const rel = Math.hypot(a.velocity.x - b.velocity.x, a.velocity.y - b.velocity.y);
      if (rel > 1 && Math.min(a.position.y, b.position.y) < SEA) bop(rel);
      if (rel > 2.5) {
        const s = p.collision && p.collision.supports && p.collision.supports[0];
        const at = s || a.position;
        if (at.y < SEA) puff(at.x, at.y, Math.min(8, Math.round(rel)), 'rgba(255,255,255,.9)');
      }
    }
  });

  // ---------- simulation ----------
  function afterStep() {
    let top = 0;
    for (const b of Composite.allBodies(world)) {
      if (b.isStatic) continue;
      const pl = b.plugin;
      if (b.isSleeping || (b.speed < 0.3 && b.angularSpeed < 0.02)) pl.calm++; else pl.calm = 0;
      if (pl.calm > 30 && b.position.y < SEA && b.bounds.min.y < top) top = b.bounds.min.y;
      if (!pl.wet && b.position.y > SEA) { pl.wet = true; splash(b.position.x); splashSound(); }
      if (b.position.y > SEA + 160) { Composite.remove(world, b); loseLife(); }
    }
    height = Math.max(0, -top / U);
    if (!over && height > peak) {
      peak = height;
      const m = Math.floor(peak / 5);
      if (m > milestone) { milestone = m; confetti(top, (m * 5) + ' m!'); }
    }
  }

  // ---------- drawing ----------
  function tracePart(c, p) {
    const v = p.vertices;
    c.moveTo(v[0].x, v[0].y);
    for (let i = 1; i < v.length; i++) c.lineTo(v[i].x, v[i].y);
    c.closePath();
  }
  function drawBody(c, b, t, mood) {
    const pl = b.plugin, parts = b.parts.length > 1 ? b.parts.slice(1) : [b];
    c.lineJoin = 'round'; c.lineWidth = 5;
    c.strokeStyle = mood === 'bad' ? '#e03131' : pl.dark;
    c.beginPath(); parts.forEach(p => tracePart(c, p)); c.stroke();
    c.fillStyle = pl.color; c.fill();
    // face
    const at = parts[pl.part] ? parts[pl.part].position : b.position, s = pl.face;
    c.save(); c.translate(at.x, at.y); c.rotate(b.angle);
    const ex = s * 0.26, ey = -s * 0.08, er = Math.max(2.5, s * 0.085);
    c.fillStyle = 'rgba(255,255,255,.35)';
    c.beginPath(); c.arc(-ex * 1.55, ey + er * 2.2, er * 1.1, 0, 7); c.arc(ex * 1.55, ey + er * 2.2, er * 1.1, 0, 7); c.fill();
    c.strokeStyle = c.fillStyle = '#1b2a5a'; c.lineWidth = Math.max(2, s * 0.05); c.lineCap = 'round';
    const asleep = b.isSleeping, blinking = ((t / 1000 + pl.blink) % 4.2) < 0.13;
    if (asleep || blinking) {
      c.beginPath(); c.arc(-ex, ey, er, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
      c.beginPath(); c.arc(ex, ey, er, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
    } else {
      c.beginPath(); c.arc(-ex, ey, er, 0, 7); c.arc(ex, ey, er, 0, 7); c.fill();
      c.fillStyle = '#fff';
      c.beginPath(); c.arc(-ex + er * 0.3, ey - er * 0.35, er * 0.35, 0, 7); c.arc(ex + er * 0.3, ey - er * 0.35, er * 0.35, 0, 7); c.fill();
    }
    c.fillStyle = '#1b2a5a';
    if (mood === 'held' || mood === 'bad' || (!asleep && b.speed > 3)) {
      c.beginPath(); c.arc(0, ey + er * 2.6, er * 0.9, 0, 7); c.fill();
    } else {
      c.beginPath(); c.arc(0, ey + er * 1.2, er * 1.7, 0.18 * Math.PI, 0.82 * Math.PI); c.stroke();
    }
    c.restore();
  }

  function drawSlot(canvas, block, t) {
    const c = canvas.getContext('2d'), size = canvas.clientWidth || 76;
    const px = Math.round(size * dpr);
    if (canvas.width !== px) { canvas.width = canvas.height = px; }
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, px, px);
    if (!block) return;
    const b = block.body, k = Math.min(1, (size - 12) / b.plugin.span) * dpr;
    c.setTransform(k, 0, 0, k, px / 2 - b.position.x * k, px / 2 - b.position.y * k);
    drawBody(c, b, t, '');
  }

  const lerp = (a, b, t) => a + (b - a) * t;
  const mix = (a, b, t) => 'rgb(' + Math.round(lerp(a[0], b[0], t)) + ',' + Math.round(lerp(a[1], b[1], t)) + ',' + Math.round(lerp(a[2], b[2], t)) + ')';
  const SKY = [
    { h: 0, top: [120, 200, 255], bot: [214, 243, 255] },
    { h: 30, top: [118, 104, 214], bot: [255, 196, 178] },
    { h: 70, top: [18, 20, 60], bot: [74, 62, 146] }
  ];
  const clouds = [], stars = [];
  for (let i = 0; i < 18; i++) clouds.push({ x: Math.random() * 1600 - 560, y: 60 - i * 170 - Math.random() * 90, s: 0.6 + Math.random() * 0.8, v: 0.004 + Math.random() * 0.008 });
  for (let i = 0; i < 70; i++) stars.push({ x: Math.random(), y: Math.random(), r: 0.6 + Math.random() * 1.4, p: Math.random() * 6 });

  function render(t, dt) {
    const k = dpr * scale;
    // sky
    const alt = (camBase - camY) / U;
    let i = alt >= SKY[1].h ? 1 : 0;
    const f = Math.max(0, Math.min(1, (alt - SKY[i].h) / (SKY[i + 1].h - SKY[i].h)));
    const night = i === 1 ? f : 0, dusk = i === 1 ? 1 : f;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const g = ctx.createLinearGradient(0, 0, 0, cssH);
    g.addColorStop(0, mix(SKY[i].top, SKY[i + 1].top, f)); g.addColorStop(1, mix(SKY[i].bot, SKY[i + 1].bot, f));
    ctx.fillStyle = g; ctx.fillRect(0, 0, cssW, cssH);
    if (dusk > 0.3) {
      ctx.fillStyle = '#fff';
      for (const s of stars) {
        ctx.globalAlpha = (dusk - 0.3) / 0.7 * (0.5 + 0.5 * Math.sin(t / 700 + s.p));
        ctx.beginPath(); ctx.arc(s.x * cssW, s.y * cssH, s.r, 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    ctx.setTransform(k, 0, 0, k, k * offX, -k * camY);
    // clouds (slower than the camera)
    ctx.fillStyle = 'rgba(255,255,255,' + (0.85 - night * 0.6) + ')';
    for (const c of clouds) {
      if (!reduceMotion) c.x += c.v * dt;
      if (c.x > viewW - offX + 160) c.x = -offX - 160;
      const y = c.y + (camY - camBase) * 0.45 + camBase, s = c.s;
      if (y < camY - 80 || y > camY + viewH + 80) continue;
      ctx.beginPath();
      ctx.arc(c.x, y, 26 * s, 0, 7); ctx.arc(c.x + 30 * s, y - 12 * s, 32 * s, 0, 7);
      ctx.arc(c.x + 66 * s, y, 26 * s, 0, 7); ctx.rect(c.x, y, 66 * s, 26 * s);
      ctx.fill();
    }

    // height ruler on the left edge, one tick per metre
    const rulerX = -offX, ink = dusk > 0.6 ? 'rgba(255,255,255,.75)' : 'rgba(27,42,90,.5)';
    ctx.strokeStyle = ctx.fillStyle = ink; ctx.lineWidth = 2; ctx.lineCap = 'butt';
    ctx.font = '600 13px Fredoka, sans-serif'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    const mMax = Math.floor(-camY / U), mMin = Math.max(0, Math.ceil(-(camY + viewH) / U));
    ctx.beginPath();
    for (let m = mMin; m <= mMax; m++) {
      const y = -m * U, five = m % 5 === 0;
      ctx.moveTo(rulerX, y); ctx.lineTo(rulerX + (five ? 16 : 8), y);
      if (five && m > 0) ctx.fillText(m + ' m', rulerX + 22, y);
    }
    ctx.stroke();

    // peak line
    if (peak > 0.6) {
      const y = -peak * U;
      ctx.setLineDash([10, 10]); ctx.strokeStyle = dusk > 0.6 ? 'rgba(255,255,255,.6)' : 'rgba(27,42,90,.35)';
      ctx.beginPath(); ctx.moveTo(-offX + 70, y); ctx.lineTo(viewW - offX, y); ctx.stroke(); ctx.setLineDash([]);
      ctx.textAlign = 'right'; ctx.fillStyle = ink; ctx.fillText('peak ' + peak.toFixed(1) + ' m', viewW - offX - 12, y - 11);
    }

    // back sea
    const left = -offX - 10, right = viewW - offX + 10, bottom = camY + viewH + 10;
    function sea(y0, amp, phase, color) {
      ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(left, bottom);
      for (let x = left; x <= right + 20; x += 20) ctx.lineTo(x, y0 + Math.sin(x / 46 + phase) * amp);
      ctx.lineTo(right, bottom); ctx.closePath(); ctx.fill();
    }
    const wave = reduceMotion ? 0 : t / 900;
    sea(SEA - 8, 5, wave, night > 0.5 ? '#2b5fa8' : '#5bb8f2');

    // island
    ctx.fillStyle = '#8a6a55';
    ctx.beginPath(); ctx.moveTo(W / 2 - 100, 40); ctx.lineTo(W / 2 + 100, 40); ctx.lineTo(W / 2 + 46, SEA + 400); ctx.lineTo(W / 2 - 46, SEA + 400); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#a9826a'; roundRect(W / 2 - 125, 0, 250, 50, 14); ctx.fill();
    ctx.fillStyle = '#6fd66b'; roundRect(W / 2 - 125, 0, 250, 20, 10); ctx.fill();
    ctx.beginPath(); for (let x = W / 2 - 110; x <= W / 2 + 110; x += 22) ctx.arc(x, 18, 11, 0, Math.PI); ctx.fill();

    // blocks
    for (const b of Composite.allBodies(world)) if (!b.isStatic) drawBody(ctx, b, t, '');
    if (drag && current) {
      ctx.globalAlpha = drag.ok ? 0.92 : 0.55;
      drawBody(ctx, current.body, t, drag.ok ? 'held' : 'bad');
      ctx.globalAlpha = 1;
    }

    // particles
    for (let n = particles.length - 1; n >= 0; n--) {
      const p = particles[n]; p.life += dt;
      if (p.life >= p.max) { particles.splice(n, 1); continue; }
      const s = dt / STEP; p.vy += p.g * s; p.x += p.vx * s; p.y += p.vy * s;
      const a = 1 - p.life / p.max;
      ctx.globalAlpha = Math.min(1, a * 1.6);
      if (p.text) {
        ctx.font = '700 34px Fredoka, sans-serif'; ctx.textAlign = 'center';
        ctx.lineWidth = 6; ctx.strokeStyle = '#1b2a5a'; ctx.lineJoin = 'round'; ctx.strokeText(p.text, p.x, p.y);
        ctx.fillStyle = '#ffd166'; ctx.fillText(p.text, p.x, p.y);
      } else if (p.sq) {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.spin + p.life / 120); ctx.fillStyle = p.color;
        ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore();
      } else {
        ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.5 + a * 0.5), 0, 7); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // front sea
    sea(SEA + 6, 6, wave * 1.3 + 2, night > 0.5 ? 'rgba(30,70,150,.9)' : 'rgba(47,143,216,.9)');

    drawSlot(nextCv, drag ? null : current, t);
    drawSlot(holdCv, held, t);
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  // ---------- layout + loop ----------
  function resize() {
    const r = $('stage').getBoundingClientRect();
    cssW = r.width; cssH = r.height;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
    scale = Math.min(cssW / W, cssH / 700);
    viewW = cssW / scale; viewH = cssH / scale; offX = (viewW - W) / 2;
    const barH = bar.getBoundingClientRect().height || 120;
    const oldBase = camBase;
    camBase = -(viewH - barH / scale - 150);
    camY += camBase - oldBase;
  }
  window.addEventListener('resize', resize);

  let hudCache = '', last = 0, acc = 0;
  function frame(t) {
    const dt = Math.min(50, t - last || STEP); last = t;
    acc += dt; let steps = 0;
    while (acc >= STEP && steps < 3) { Engine.update(engine, STEP); afterStep(); acc -= STEP; steps++; }
    if (acc > STEP) acc = 0;

    if (current) {
      const b = current.body, d = current.target - b.angle;
      if (Math.abs(d) > 0.001) Body.setAngle(b, b.angle + d * (reduceMotion ? 1 : 0.35));
    }
    const follow = Math.min(camBase, -height * U - viewH * 0.42);
    if (drag && drag.armed) {
      // Holding a block near the top or bottom edge scrolls the view, so any gap can be reached.
      const r = cv.getBoundingClientRect(), barTop = bar.getBoundingClientRect().top;
      const blockY = drag.cy - (drag.touch ? 80 : 0), sp = 9 * dt / STEP;
      if (blockY < r.top + 70) lookAround(-sp);
      else if (drag.cy > barTop - 50 && drag.cy < barTop) lookAround(sp);
    }
    if (!manualCam) camY += (follow - camY) * (reduceMotion ? 1 : 0.06);
    const camTop = Math.min(camBase, -Math.max(peak, height) * U - viewH * 0.6);
    camY = Math.max(camTop, Math.min(camBase, camY));
    const showFollow = manualCam && Math.abs(camY - follow) > 40 && !over;
    if (showFollow === $('follow').hidden) $('follow').hidden = !showFollow;
    if (!lookHintShown && peak > 8 && !over) {
      lookHintShown = true;
      hint.textContent = 'Drag the sky to look down the tower';
      hint.classList.remove('hide');
      setTimeout(() => hint.classList.add('hide'), 3500);
    }
    if (drag) placeHeld();

    const hud = height.toFixed(1) + '|' + peak.toFixed(1);
    if (hud !== hudCache) {
      hudCache = hud;
      $('h').textContent = height.toFixed(1) + ' m';
      $('pk').textContent = 'Peak ' + peak.toFixed(1) + ' m' + (best > 0 ? '  ·  Best ' + Math.max(best, peak).toFixed(1) + ' m' : '');
    }
    render(t, dt);
    requestAnimationFrame(frame);
  }

  resize();
  camY = camBase;
  reset();
  renderBoard();
  initBoard();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
